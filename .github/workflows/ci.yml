name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo "unformatted:"; gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1

  dash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no em dashes or en dashes
        run: |
          if grep -rIn --exclude-dir=.git -P '\x{2014}|\x{2013}' . ; then
            echo "found an em dash or an en dash. Use a comma, a colon, parentheses, or a full stop."
            exit 1
          fi
